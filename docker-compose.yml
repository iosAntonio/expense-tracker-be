services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: ${DB_USER:-expense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expense}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/expense_tracker
      DB_USER: ${DB_USER:-expense}
      DB_PASSWORD: ${DB_PASSWORD:-expense}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  test:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /build
    volumes:
      - .:/src:ro
      - m2-cache:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["sh", "-c", "cp -a /src/. /build && mvn -B verify"]

volumes:
  db-data:
  m2-cache:
