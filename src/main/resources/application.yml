server:
  port: 8080

spring:
  application:
    name: expense-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/expense_tracker}
    username: ${DB_USER:expense}
    password: ${DB_PASSWORD:expense}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
